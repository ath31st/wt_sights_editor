[package]
name = "wt_sights_editor"
version = "0.1.1"
description = "WT Sights Editor"
authors = ["you"]
edition = "2021"

[lib]
name = "wt_sights_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
